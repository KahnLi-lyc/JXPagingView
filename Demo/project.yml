name: JXPagingViewDemo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'
  createIntermediateGroups: true
packages:
  JXPagingView:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
targets:
  JXPagingViewDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: JXPagingView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kahnli.JXPagingViewDemo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  JXPagingViewDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: JXPagingViewDemo
      - package: JXPagingView
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.kahnli.JXPagingViewDemoTests
  JXPagingViewDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JXPagingViewDemo
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.kahnli.JXPagingViewDemoUITests
schemes:
  JXPagingViewDemo:
    build:
      targets:
        JXPagingViewDemo: all
    test:
      gatherCoverageData: true
      targets:
        - JXPagingViewDemoTests
        - JXPagingViewDemoUITests
